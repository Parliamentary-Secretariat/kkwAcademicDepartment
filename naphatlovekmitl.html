<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="https://kkw-edx.pages.dev/IMG_7864.jpeg" type="image/jpeg">
  <title>I love KMITL</title>
  <style>
      body {
          margin: 0;
          padding: 0;
          background-image: linear-gradient(rgba(0, 0, 0, 0.25), rgba(255, 98, 0, 0.75)), url(ilovekmitl.jpg);
          background-size: cover;
          height: 100vh;
          font-family: 'Bai Jamjuree', sans-serif;
          overflow: hidden;
          background-position: center;
          background-repeat: no-repeat;
      }

    .bubble {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      animation: floatUp 5s infinite ease-in-out;
    }

    @keyframes floatUp {
      0% {
        transform: translate(-50%, 0) scale(1);
        opacity: 1;
      }
      50% {
        transform: translate(-50%, -50vh) scale(1.2);
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -100vh) scale(0.8);
        opacity: 0;
      }
    }

    .bubble:nth-child(2) {
      animation-delay: 1s;
      font-size: 2.5rem;
      color: #ffdd33;
    }

    .bubble:nth-child(3) {
      animation-delay: 2s;
      font-size: 2.2rem;
      color: #32cd32;
    }

    .bubble:nth-child(4) {
      animation-delay: 3s;
      font-size: 2.8rem;
      color: #ff69b4;
    }
  </style>
</head>
<body>
  <div class="bubble">I love KMITL</div>
  <div class="bubble">I love KMITL</div>
  <div class="bubble">I love KMITL</div>
  <div class="bubble">I love KMITL</div>
</body>
</html>
