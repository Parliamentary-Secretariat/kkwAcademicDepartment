<body>
	<a href="naphatlovekmitl" style="padding: 12px 16px;background: #000;color: #fff;position: fixed;top: 0;left: 0;font-size: 10px;">I love KMITL</a>
	<div>
      <h1>Naphat loves KMITL</h1>
      <div class="countdown">
	      <!-- style="display:none;" -->
        <div >
            <span id="days">0</span><br>วัน
        </div>
        <div>
            <span id="hours">0</span><br>ชั่วโมง
        </div>
        <div>
            <span id="minutes">0</span><br>นาที
        </div>
        <div>
            <span id="seconds">0</span><br>วินาที
        </div>
      </div>
      <p>
	<a style="padding: 12px 16px;background: #ff6200;border-radius: 5px;" href="https://student.mytcas.com">ยืนยันสิทธิ์ TCAS68</a>
      	<!--
	      <a id="interview-link" href="https://admission.reg.kmitl.ac.th/#/undergraduate/announcement_tcas" style="padding: 12px 16px;background: #ff6200;border-radius: 5px;">เข้าดูผลสัมภาษณ์</a>
	-->
	      <br>
	      <br>
	<b>การตัดสินผลการสอบสัมภาษณ์ถือเป็นสิทธิ์เด็ดขาด<br>ของกรรมการสอบสัมภาษณ์และคณะวิศวกรรมศาสตร์ สจล.</b>
      </p>

	<script>
	    // ตั้งค่าวันที่เป้าหมาย
	    const targetDate = new Date("2025-02-05T08:55:00").getTime();
	
	    function updateCountdown() {
	      const now = new Date().getTime();
	      const timeLeft = targetDate - now;
	
	      if (timeLeft > 0) {
	        const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
	        const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
	        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
	        const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
	
	        document.getElementById("days").textContent = days;
	        document.getElementById("hours").textContent = hours;
	        document.getElementById("minutes").textContent = minutes;
	        document.getElementById("seconds").textContent = seconds;
	      } else {
	        document.querySelector('.countdown').textContent = "หมดเวลา!";
	        clearInterval(interval);
	      }
	    }
	
	    // อัปเดตตัวนับทุกวินาที
	    const interval = setInterval(updateCountdown, 1000);
	    updateCountdown();
	  </script>
	<script>
        // วันที่และเวลาที่ต้องการให้ลิงก์กดได้
        const targetDate = new Date('2025-01-24T16:55:00');
​
        // ตรวจสอบวันที่และเวลา
        function checkDate() {
            const currentDate = new Date();
            const link = document.getElementById('interview-link');
​
            if (currentDate >= targetDate) {
                // เปิดใช้งานลิงก์
                link.style.pointerEvents = 'auto';
                link.style.color = ''; // คืนค่าการตั้งค่าสี
            } else {
                // ปิดการใช้งานลิงก์
                link.style.pointerEvents = 'none';
                link.style.color = 'gray';
            }
        }
​
        // เรียกใช้ฟังก์ชันทันทีเมื่อโหลดหน้า
        checkDate();
​
        // ตั้งให้ฟังก์ชันตรวจสอบซ้ำทุกวินาที
        setInterval(checkDate, 1000);

	/// ฟังก์ชันสำหรับเปลี่ยนพื้นหลัง
function updateBackground() {
  const now = new Date();
  const hour = now.getHours(); // ดึงชั่วโมงปัจจุบัน

  // ตรวจสอบชั่วโมงคู่และคี่
  if (hour % 2 === 0) {
    document.body.style.backgroundImage = 
      "linear-gradient(rgba(0, 0, 0, 0.25), rgba(255, 98, 0, 0.75)), url('ilovekmitl.jpg')";
  } else {
    document.body.style.backgroundImage = 
      "linear-gradient(rgba(0, 0, 0, 0.25), rgba(98, 0, 255, 0.75)), url('phra_chom_klao.jpg')";
  }
}

// เรียกใช้งานฟังก์ชันทันทีเมื่อโหลด
updateBackground();

// ตั้งเวลาให้เปลี่ยนพื้นหลังทุก 1 ชั่วโมง
setInterval(updateBackground, 1000 * 60 * 60);
    </script>
